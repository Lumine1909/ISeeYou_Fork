[versions]
paperApi = "1.21.8-R0.1-SNAPSHOT"
paperweightUserdev = "2.0.0-beta.18"
shadow = "9.0.0-rc1"
runPaper = "2.3.1"
resourceFactory = "1.3.0"
commandApi = "10.1.2"
configurate = "4.2.0"
expiringmap = "0.5.11"
# recorder-api
recorderApi = "1.3.5"

# anti-cheat-apis
grim = "1.0.0-8ad0b94"
negativity = "2.7.1"

[libraries]
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperApi" }
paperDevBundle = { group = "io.papermc.paper", name = "dev-bundle", version.ref = "paperApi" }
configurateHocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
configurateKotlin = { group = "org.spongepowered", name = "configurate-extra-kotlin", version.ref = "configurate" }
commandApiCore = { group = "dev.jorel", name = "commandapi-bukkit-core", version.ref = "commandApi" }
commandApiKotlin = { group = "dev.jorel", name = "commandapi-bukkit-kotlin", version.ref = "commandApi" }
expiringMap = { group = "net.jodah", name = "expiringmap", version.ref = "expiringmap" }
# recorder-api
recorderApi = { group = "io.github.lumine1909", name = "recorderapi", version.ref = "recorderApi" }
recorderApiPlugin = { group = "io.github.lumine1909", name = "recorderapi-plugin", version.ref = "recorderApi" }
# anti-cheat-apis
negativityApi = { group = "com.github.Elikill58", name = "Negativity", version.ref = "negativity" }
grimApi = { group = "ac.grim.grimac", name = "GrimAPI", version.ref = "grim" }

[plugins]
paperweightUserdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweightUserdev" }
shadowJar = { id = "com.gradleup.shadow", version.ref = "shadow" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
resourceFactory = { id = "xyz.jpenilla.resource-factory", version.ref = "resourceFactory" }